<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Papan Kosong</title>
    <style>
        :root {
            /* Gradien biru ke kuning lembut sesuai permintaan */
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 100%);
            --suit-blue: #2a4365;
            --skin-color: #fbd38d;
            --hair-color: #1a202c;
            --board-border: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            overflow: hidden; /* Mencegah scrollbar saat disematkan (embed) */
        }

        /* Container utama untuk memusatkan konten */
        .dashboard-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center; /* Memusatkan secara vertikal */
            justify-content: center; /* Memusatkan secara horizontal */
            padding: 2rem;
        }

        .main-content {
            width: 100%;
            max-width: 1100px;
            height: 75vh;
            display: flex;
            align-items: flex-end; /* Memastikan karakter dan papan sejajar di bawah */
            justify-content: center;
            gap: 4vw;
        }

        /* Karakter Pria */
        .character-container {
            flex: 0 0 35%;
            max-width: 320px;
            position: relative;
            z-index: 2;
            transform-origin: bottom center;
            animation: slightBreathe 4s ease-in-out infinite;
        }

        .character-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .board-container {
            flex: 0 0 60%;
            max-width: 650px;
            height: 100%;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .whiteboard {
            width: 100%;
            height: calc(100% - 40px); /* Menyisakan ruang untuk kaki papan */
            background-color: rgba(255, 255, 255, 0.95);
            border: 8px solid var(--board-border);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Rak Spidol pada Papan */
        .board-tray {
            position: absolute;
            bottom: -8px;
            left: 5%;
            width: 90%;
            height: 8px;
            background-color: #94a3b8;
            border-radius: 0 0 4px 4px;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2);
        }

        /* Kaki Papan (Stand) */
        .board-legs {
            position: absolute;
            bottom: 0;
            width: 85%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            z-index: -1;
        }

        .leg {
            width: 16px;
            height: 100%;
            background-color: #94a3b8;
            border-radius: 0 0 4px 4px;
            box-shadow: inset -2px 0 0 rgba(0,0,0,0.15);
        }

        /* Area Kosong untuk Google Data Studio */
        .placeholder-area {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animasi Nafas/Mengambang Halus pada Karakter */
        @keyframes slightBreathe {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.015) translateY(-4px); }
        }

        /* Animasi Lengan Menulis/Menunjuk */
        .writing-arm {
            transform-origin: 175px 125px; /* Sumbu putar (bahu kanan) */
            animation: writeMove 2.5s ease-in-out infinite;
        }

        @keyframes writeMove {
            0% { transform: rotate(-5deg); }
            50% { transform: rotate(8deg); }
            100% { transform: rotate(-5deg); }
        }

        /* Responsivitas Layar Kecil */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column-reverse; /* Karakter di bawah, papan di atas */
                align-items: center;
                gap: 20px;
                height: 90vh;
            }
            .board-container {
                width: 100%;
                height: 60%;
            }
            .character-container {
                width: 50%;
                height: 40%;
                max-width: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <div class="main-content">
            
            <!-- Karakter SVG (Pria dengan Spidol) -->
            <div class="character-container">
                <svg class="character-svg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
                    <!-- Bayangan di bawah karakter -->
                    <ellipse cx="140" cy="385" rx="85" ry="14" fill="#cbd5e0" opacity="0.6"/>

                    <!-- Kaki Karakter -->
                    <rect x="105" y="250" width="24" height="130" rx="4" fill="var(--suit-blue)"/>
                    <rect x="145" y="250" width="24" height="130" rx="4" fill="var(--suit-blue)"/>
                    <!-- Sepatu -->
                    <path d="M95 375 h 35 v 10 a 3 3 0 0 1 -3 3 h -29 a 3 3 0 0 1 -3 -3 z" fill="#0f172a"/>
                    <path d="M145 375 h 40 v 10 a 3 3 0 0 1 -3 3 h -34 a 3 3 0 0 1 -3 -3 z" fill="#0f172a"/>

                    <!-- Badan Jas -->
                    <path d="M85 130 C 85 95, 185 95, 190 130 L 195 260 C 195 275, 80 275, 80 260 Z" fill="var(--suit-blue)"/>
                    
                    <!-- Kemeja Dalam -->
                    <path d="M115 115 L 165 115 L 145 250 L 130 250 Z" fill="#ffffff"/>
                    <!-- Dasi -->
                    <path d="M136 130 L 144 130 L 146 200 L 140 210 L 134 200 Z" fill="#2563eb"/>
                    
                    <!-- Kerah -->
                    <path d="M115 110 L 140 140 L 135 110 Z" fill="#f8fafc"/>
                    <path d="M165 110 L 140 140 L 145 110 Z" fill="#f8fafc"/>

                    <!-- Lengan Kiri (Beristirahat di sisi) -->
                    <path d="M85 125 C 55 145, 60 205, 70 230 L 95 220 C 85 185, 100 155, 105 135 Z" fill="var(--suit-blue)"/>
                    <!-- Tangan Kiri -->
                    <circle cx="78" cy="235" r="13" fill="var(--skin-color)"/>

                    <!-- Leher -->
                    <rect x="130" y="90" width="20" height="25" fill="var(--skin-color)"/>

                    <!-- Kepala (Wajah) -->
                    <circle cx="140" cy="70" r="35" fill="var(--skin-color)"/>
                    
                    <!-- Rambut -->
                    <path d="M98 65 C 98 15, 185 15, 178 70 C 172 85, 165 85, 165 75 C 160 35, 110 35, 105 75 Z" fill="var(--hair-color)"/>
                    <circle cx="103" cy="75" r="7" fill="var(--skin-color)"/> <!-- Telinga -->

                    <!-- Kacamata -->
                    <g stroke="#1e293b" stroke-width="3" fill="none">
                        <rect x="122" y="55" width="24" height="16" rx="4"/>
                        <rect x="156" y="55" width="22" height="16" rx="4"/>
                        <path d="M146 63 L 156 63"/> <!-- Bagian tengah kacamata (Bridge) -->
                        <path d="M103 63 L 122 63"/> <!-- Gagang samping -->
                    </g>
                    
                    <!-- Mata & Senyum -->
                    <circle cx="134" cy="63" r="3" fill="#1e293b"/>
                    <circle cx="167" cy="63" r="3" fill="#1e293b"/>
                    <path d="M138 85 Q 148 93 158 85" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

                    <!-- Lengan Kanan (Beranimasi, membawa spidol) -->
                    <g class="writing-arm">
                        <!-- Lengan Jas -->
                        <path d="M175 125 C 230 120, 275 145, 290 160 L 270 185 C 240 165, 195 155, 180 165 Z" fill="var(--suit-blue)"/>
                        <!-- Kemeja Manset -->
                        <polygon points="275,155 295,170 282,188 262,173" fill="#ffffff"/>
                        <!-- Tangan -->
                        <path d="M290,165 C 310,165 315,180 310,190 C 295,200 280,195 275,185 Z" fill="var(--skin-color)"/>
                        
                        <!-- Spidol -->
                        <rect x="295" y="150" width="12" height="48" rx="3" transform="rotate(50 295 150)" fill="#1e293b"/>
                        <polygon points="334,184 348,194 332,201" fill="#1e293b"/> <!-- Ujung Spidol -->
                    </g>
                </svg>
            </div>

            <!-- Papan Tulis / Area Presentasi -->
            <div class="board-container">
                <div class="whiteboard">
                    <div class="board-tray"></div>
                    <!-- Area ini benar-benar kosong, siap untuk di-overlay oleh elemen Data Studio -->
                    <div class="placeholder-area"></div>
                </div>
                <!-- Kaki Penyangga Papan -->
                <div class="board-legs">
                    <div class="leg"></div>
                    <div class="leg"></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
