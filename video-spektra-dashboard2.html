<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Video Spektra Dashboard</title>
<style>
  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:#000;
  }

  video{
    width:100%; height:100%;
    object-fit: cover; /* ganti ke "contain" kalau video jadi terpotong dan Anda lebih suka full frame terlihat (bisa ada bar hitam di sisi) */
    display:block;
  }
</style>
</head>
<body>

  <video autoplay loop muted playsinline>
    <source src="https://adiaveroes.github.io/dashboard-tv/spektra_video2.mp4" type="video/mp4">
    Browser Anda tidak mendukung tag video.
  </video>

</body>
</html>
